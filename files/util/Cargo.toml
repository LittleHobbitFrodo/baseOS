#   This file is here to make rust-analyzer shut up :)
#       (is not used by rust-script)

[package]
name = "util"
description="convenience program for project management"
version = "0.1.0"
edition = "2024"
license="MIT"

[profile.dev]
panic="abort"

[features]
disable_ctor_checks=[]  #   disables the "the project is not configured" error

[profile.release]
opt-level = 3

[dependencies]
colored = "3.0.0"
ctor = "0.5.0"
paste = "1.0.15"
serde = { version="1.0.228", features = ["derive"] }
toml = "0.9.7"



[[bin]]
name="example"
path="src/main.rs"

[[bin]]
name="conf"
path="src/conf.rs"

[[bin]]
name="forge"
path="src/forge.rs"
